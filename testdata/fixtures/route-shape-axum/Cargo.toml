[package]
name = "route-shape-axum"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.8"
axum-extra = { version = "0.10.3", features = ["typed-header"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = { version = "3.12.0", default-features = false, features = ["macros", "std"] }
