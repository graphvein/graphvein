# Deploy overlay: read on its own, never merged with compose.yml. Its api
# service has a build of its own, so CD3 maps it; Traefik labels prove TLS
# at its ingress (DC-T1, AT2).
services:
  api:
    build: ./api
    labels:
      traefik.http.routers.api-https.rule: Host(`${DOMAIN:?unset}`)
      traefik.http.routers.api-https.entrypoints: websecure
      traefik.http.routers.api-https.tls: true
      traefik.http.routers.api-https.tls.certresolver: le
      traefik.http.routers.api-https.middlewares: compress
      traefik.http.routers.api-plain.tls: "${TLS_ON}"
  admin:
    image: adminer
    labels:
      - traefik.http.routers.${STACK_NAME?unset}-admin.tls=true
  hidden:
    build: ./web
    labels:
      traefik.enable: false
      traefik.http.routers.hidden-https.tls: true
