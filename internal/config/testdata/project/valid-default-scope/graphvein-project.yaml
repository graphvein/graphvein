version: 1
name: shop
members:
  # web calls only the server outside apps/admin.
  - repository: web
    consumes:
      - repository: api
        default_scope: true
        select:
          bases: [VITE_API]
  - repository: api
    scopes:
      - name: admin
        path: apps/admin
        # The admin scope calls the rest of its own repository.
        consumes:
          - {repository: api, default_scope: true}
      - name: tools
        path: tools
        consumes:
          - {repository: api, scope: admin}
          - {repository: api, default_scope: true}
