version: 1
name: shop
members:
  - repository: web
    path: web
    consumes:
      - repository: api
        select:
          bases: [__API_URL__]
          origins: ["http://localhost:3000"]
          path_prefixes: [/api]
      - repository: api
        scope: admin
        select:
          path_prefixes: [/admin]
  - repository: api
    path: checkouts/api
    scopes:
      - name: admin
        path: apps/admin
        consumes: [auth]
      - name: public
        path: apps/public
  - repository: auth
