# Dependabot version updates (docs/public/ci-plan.md, "Pinned actions").
#
# Dependabot runs only in the public repository (graphvein/graphvein), where
# this file is .github/dependabot.yml. Dependabot acts in any repository
# whose default branch holds that file, so the maintainer's working
# repository keeps it as docs/public/dependabot.yml and the public snapshot
# (scripts/public-snapshot.sh) places it. Updates arrive as weekly pull
# requests: minor and patch updates grouped per ecosystem, and major
# updates grouped per ecosystem in a second pull request, so a week brings
# at most two per ecosystem. The maintainer takes them in through the next
# export rather than merging them in the public repository; Dependabot
# then closes them.
version: 2
updates:
  # Workflow actions are pinned by full commit SHA with the tag as a
  # comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  # The main Go module.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        update-types: [minor, patch]
      go-major:
        update-types: [major]

  # The website generator, its own Go module (ADR 0091).
  - package-ecosystem: gomod
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      site-go-minor-patch:
        update-types: [minor, patch]
      site-go-major:
        update-types: [major]

  # The web UI.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-npm-minor-patch:
        update-types: [minor, patch]
      web-npm-major:
        update-types: [major]
