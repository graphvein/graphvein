name: Bug report
description: Graphvein crashes, fails, or behaves differently from its documentation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If Graphvein shows a fact about your code that is wrong, use the "Wrong fact" form instead. Report security problems privately (see SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `graphvein version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command or UI action, and what you saw (error messages, diagnostics).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Ideally on a small or public repository. Do not paste private code you cannot share.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
