name: Documentation problem
description: Something in the documentation is wrong, unclear or missing.
labels: ["docs"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: for example docs/cli/serve.md or README.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or fix
