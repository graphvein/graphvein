name: Release

# Builds the release archives of a version tag, attests their provenance and
# creates a draft GitHub release that the maintainer reviews and publishes
# by hand. Release binaries are built only here, in the public repository,
# from a public tagged commit on main. A manual dispatch is a dry run: it
# builds and uploads the archives as a workflow artifact, and creates no
# attestation and no release.
#
# Archives: scripts/release-archives.sh (one per system in
# `go run ./scripts/release -list`, with LICENSE, NOTICE,
# THIRD_PARTY_NOTICES and README.md) and SHA256SUMS over them. The release
# notes come from docs/releases/<tag>.md, which must exist on the tag,
# unwrapped for the release body by scripts/releasenotes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version written into the dry run's binaries and archive names
        required: true
        default: v0.0.0-dryrun

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  release:
    # Never in the maintainer's working repository: binaries come only from
    # public commits.
    if: github.repository == 'graphvein/graphvein'
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # gh release create
      id-token: write      # provenance attestation (Sigstore signing certificate)
      attestations: write  # store the attestation
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # No cache restored from other runs into a release build.
          cache: false
      - name: Version and release notes
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then version=$TAG; else version=$INPUT; fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version $version is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          if [ "$EVENT" = push ]; then
            # A release is built only from a commit that is on main.
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::tag $version is not on main"
              exit 1
            fi
            if [ ! -f "docs/releases/$version.md" ]; then
              echo "::error::docs/releases/$version.md (the release notes) is missing on the tag"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download modules
        run: go mod download
      # GitHub keeps every line break of a release body, so the wrapped
      # notes file is passed with its paragraphs and list items joined, its
      # comments removed and without its title (scripts/releasenotes).
      - name: Release body
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: go run ./scripts/releasenotes "docs/releases/$VERSION.md" > "$RUNNER_TEMP/release-notes.md"
      - name: Third-party notices are current
        run: go run ./scripts/notices -check
      # The full suite on Linux, without Postgres: a tag may point at a commit
      # whose main run is still going or was skipped, and the suite is the
      # cheapest way to be sure the tagged tree is the tested one.
      - name: Vet and test
        run: bash scripts/test.sh
      - name: Build the release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPORT_URL: https://github.com/graphvein/graphvein/issues/new
        run: bash scripts/release-archives.sh "$VERSION" dist
      - name: Smoke test the Linux binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          name="graphvein-$VERSION-linux-amd64"
          mkdir smoke
          tar -xzf "dist/$name.tar.gz" -C smoke
          first=$("smoke/$name/graphvein" version | head -1)
          [ "$first" = "graphvein $VERSION" ] || { echo "::error::version printed $first"; exit 1; }
          bash scripts/smoke-serve.sh "smoke/$name/graphvein"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Graphvein $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
