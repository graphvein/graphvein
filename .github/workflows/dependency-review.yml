name: Dependency review

# Fails a pull request that adds or updates a dependency with a known
# vulnerability of high or critical severity (ADR 0086), from the manifests
# and lock files the pull request changes. It runs only in the public
# repository: the maintainer's working repository has no dependency graph
# for it. Licences are not checked here: the licence allowlist covers the
# dependencies bundled into the binary and is enforced by
# `go run ./scripts/notices -check` in the test suite.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.repository == 'graphvein/graphvein'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
